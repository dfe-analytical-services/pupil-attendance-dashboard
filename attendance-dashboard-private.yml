resources:
  repositories:
  - repository: posit-deploy
    type: git
    name: ESFA-Data-Science/posit-deploy
name: Release-$(rev:r)
pool:
  name: RSConnect
trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - azure-pipelines.yml
stages:
- stage: build
  displayName: Build
  jobs:
  - job: posit_build
    displayName: attendance-dashboard-private Build
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: posit-deploy
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        path: s\R
    - task: PowerShell@2
      displayName: Check application identifier
      inputs:
        targetType: inline
        failOnStderr: true
        script: >
          $appId = '704'

          if (($appId -notmatch '^[+-]?\d+$') -and ($appId -ine 'none')) {
            throw "Invalid application identifier. Please use numeric Content ID."}
    - task: PowerShell@2
      displayName: Check application identifier
      inputs:
        targetType: inline
        failOnStderr: true
        script: >
          $appId = '277'

          if (($appId -notmatch '^[+-]?\d+$') -and ($appId -ine 'none')) {
            throw "Invalid application identifier. Please use numeric Content ID."}
    - task: PythonScript@0
      displayName: Get application type
      name: application_type
      inputs:
        scriptSource: filePath
        scriptPath: $(System.DefaultWorkingDirectory)\posit-deploy\scripts\application_type.py
        workingDirectory: $(System.DefaultWorkingDirectory)\R
        failOnStderr: true
    - task: ArchiveFiles@2
      displayName: Archive application files
      inputs:
        rootFolderOrFile: $(System.DefaultWorkingDirectory)\R
        archiveType: zip
        includeRootFolder: false
        archiveFile: $(Build.ArtifactStagingDirectory)\attendance-dashboard-private-$(Build.BuildNumber).zip
    - task: ecdc45f6-832d-4ad9-b52b-ee49e94659be@1
      displayName: Publish application archive
      inputs:
        path: $(Build.ArtifactStagingDirectory)\attendance-dashboard-private-$(Build.BuildNumber).zip
        artifactName: attendance-dashboard-private-$(Build.BuildNumber)
- stage: pre_production_deploy
  displayName: Pre-Production Deploy
  jobs:
  - deployment: posit_deploy
    displayName: attendance-dashboard-private Deploy
    environment:
      name: posit-pre-production
    variables:
    - name: deploy_type
      value: $[stageDependencies.build.posit_build.outputs['application_type.deploy_type']]
    - name: filepath
      value: $[stageDependencies.build.posit_build.outputs['application_type.filepath']]
    strategy:
      runOnce:
        deploy:
          steps:
          - task: ExtractFiles@1
            displayName: Extract application files
            inputs:
              archiveFilePatterns: $(Pipeline.Workspace)\attendance-dashboard-private-$(Build.BuildNumber)\attendance-dashboard-private-$(Build.BuildNumber).zip
              destinationFolder: $(System.DefaultWorkingDirectory)
              overwriteExistingFiles: true
              cleanDestinationFolder: false
          - task: CmdLine@2
            displayName: Deploy application
            inputs:
              script: rsconnect deploy $(deploy_type) $(filepath) --name pre-production --title attendance-dashboard-private --app-id 704
- stage: production_deploy
  displayName: Production Deploy
  dependsOn:
  - build
  - pre_production_deploy
  jobs:
  - job: approval
    displayName: Approval for Production deployment
    pool:
      name: server
    steps:
    - task: ManualValidation@0
      displayName: Approval for attendance-dashboard-private deployment
      timeoutInMinutes: 7200
      inputs:
        notifyUsers: ''
        instructions: Please approve attendance-dashboard-private deployment to Production environment
        onTimeout: reject
  - deployment: posit_deploy
    displayName: attendance-dashboard-private Deploy
    dependsOn:
    - approval
    environment:
      name: posit-production
    variables:
    - name: deploy_type
      value: $[stageDependencies.build.posit_build.outputs['application_type.deploy_type']]
    - name: filepath
      value: $[stageDependencies.build.posit_build.outputs['application_type.filepath']]
    strategy:
      runOnce:
        deploy:
          steps:
          - task: ExtractFiles@1
            displayName: Extract application files
            inputs:
              archiveFilePatterns: $(Pipeline.Workspace)\attendance-dashboard-private-$(Build.BuildNumber)\attendance-dashboard-private-$(Build.BuildNumber).zip
              destinationFolder: $(System.DefaultWorkingDirectory)
              overwriteExistingFiles: true
              cleanDestinationFolder: false
          - task: CmdLine@2
            displayName: Deploy application
            inputs:
              script: rsconnect deploy $(deploy_type) $(filepath) --name production --title attendance-dashboard-private --app-id 277

